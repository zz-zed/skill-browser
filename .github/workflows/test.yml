name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install the Agent Skills reference validator
        if: matrix.python-version == '3.12'
        run: python -m pip install skills-ref==0.1.1
      - name: Validate the Skill package
        if: matrix.python-version == '3.12'
        run: agentskills validate skills/skill-browser
